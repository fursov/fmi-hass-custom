name: tests
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: prepare env
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --statistics
      - name: pylint
        run: |
          pylint custom_components/fmi/*.py --init-hook='import sys; sys.path.append(".")'

  regression:
    name: Offline regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check new test code
        run: |
          ruff check tests
          python -m compileall -q tests
      - name: Run offline regression tests
        run: bash .github/scripts/run-offline-tests.sh

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate checked-in integration metadata
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/custom_components/fmi:/github/workspace/custom_components/fmi" \
            ghcr.io/home-assistant/hassfest:latest

  ha-integration:
    name: Home Assistant integration (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - name: Install real Home Assistant test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ha-test.txt
          python -m pip show homeassistant pytest-homeassistant-custom-component
      - name: Check integration test code
        run: |
          ruff check integration_tests
          python -m compileall -q integration_tests
      - name: Run actual Home Assistant lifecycle and config flow tests
        run: bash .github/scripts/run-ha-tests.sh
