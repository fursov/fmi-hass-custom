name: tests
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: prepare env
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --statistics
      - name: pylint
        run: |
          pylint *.py --init-hook='import sys; sys.path.append(".")'

  regression:
    name: Offline regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check new test code
        run: |
          ruff check tests
          python -m compileall -q tests
      - name: Run offline regression tests
        run: bash .github/scripts/run-offline-tests.sh

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage root-layout integration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fmi-hassfest/fmi"
          cp ./*.py ./*.json "$RUNNER_TEMP/fmi-hassfest/fmi/"
          cp -r ./translations "$RUNNER_TEMP/fmi-hassfest/fmi/"
      - name: Validate integration metadata
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/fmi-hassfest/fmi:/github/workspace/custom_components/fmi" \
            ghcr.io/home-assistant/hassfest:latest
